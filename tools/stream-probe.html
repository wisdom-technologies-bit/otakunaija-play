<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HLS stream probe</title>
<style>
  body { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background:#0b1013; color:#dbe7e3; margin:0; padding:16px; }
  h1 { font-size:15px; margin:0 0 8px; color:#b7f36b; }
  #bar { position:sticky; top:0; background:#0b1013; padding:6px 0; border-bottom:1px solid #1e2b2e; z-index:2; }
  #state { color:#8fb3a8; }
  #log { white-space:pre-wrap; }
  .err { color:#ff8b7a; }
  .warn { color:#ffd479; }
  .ok { color:#8ce99a; }
  video { width:320px; background:#000; display:block; margin-bottom:8px; }
</style>
</head>
<body>
<h1>HLS stream probe</h1>
<div id="bar"><span id="state">booting…</span></div>
<video id="v" muted playsinline controls></video>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  var m = location.href.match(/[?&]u=([^&]+)/);
  var src = m ? decodeURIComponent(m[1]) : null;
  var logEl = document.getElementById('log');
  var stateEl = document.getElementById('state');
  var t0 = Date.now();
  var rows = [];
  window.__rows = rows;

  function line(kind, msg) {
    var at = ((Date.now() - t0) / 1000).toFixed(1);
    rows.push(at + 's\t' + kind + '\t' + msg);
    var div = document.createElement('div');
    if (kind === 'ERROR') div.className = 'err';
    else if (kind === 'WARN') div.className = 'warn';
    else if (kind === 'OK') div.className = 'ok';
    div.textContent = at + 's\t' + kind + '\t' + msg;
    logEl.appendChild(div);
  }

  document.getElementById('state').textContent = 'script ran; u=' + (src ? 'present' : 'MISSING') + ' href=' + location.href.slice(0, 120);
  if (!src) { line('ERROR', 'missing ?u= manifest url'); return; }
  if (!window.Hls || !window.Hls.isSupported()) { line('ERROR', 'hls.js not available / MSE unsupported'); return; }

  line('INFO', 'manifest ' + src.slice(0, 120) + '...');
  var video = document.getElementById('v');
  var hls = new window.Hls({
    debug: false,
    enableWorker: true,
    capLevelToPlayerSize: true,
    maxBufferLength: 30,
    maxMaxBufferLength: 60
  });
  window.__hls = hls;

  hls.on(window.Hls.Events.MANIFEST_PARSED, function (_e, d) {
    var levels = d.levels.map(function (l) { return l.width + 'x' + l.height + '@' + Math.round(l.bitrate / 1000) + 'k'; });
    line('OK', 'manifest parsed: ' + d.levels.length + ' level(s) ' + levels.join(' | '));
    video.play().catch(function (err) { line('WARN', 'play() rejected: ' + err.name); });
  });
  hls.on(window.Hls.Events.LEVEL_SWITCHED, function (_e, d) {
    var l = hls.levels[d.level];
    line('INFO', 'level -> ' + d.level + ' ' + l.width + 'x' + l.height + '@' + Math.round(l.bitrate / 1000) + 'k');
  });
  hls.on(window.Hls.Events.FRAG_LOADING, function (_e, d) {
    line('INFO', 'frag ' + d.frag.sn + ' start=' + d.frag.start.toFixed(2) + ' loading');
  });
  hls.on(window.Hls.Events.FRAG_LOADED, function (_e, d) {
    var st = d.frag.stats;
    var ms = (st.loading && st.loading.end && st.loading.start) ? Math.round(st.loading.end - st.loading.start) : '?';
    line('OK', 'frag ' + d.frag.sn + ' loaded ' + st.loaded + 'B in ' + ms + 'ms');
  });
  hls.on(window.Hls.Events.FRAG_CHANGED, function (_e, d) {
    line('INFO', 'frag ' + d.frag.sn + ' playing at ' + video.currentTime.toFixed(2));
  });
  hls.on(window.Hls.Events.ERROR, function (_e, d) {
    var extra = '';
    if (d.response) extra += ' code=' + d.response.code + ' text=' + String(d.response.text || '').slice(0, 90);
    if (d.reason) extra += ' reason=' + d.reason;
    line('ERROR', (d.fatal ? 'FATAL ' : 'nonfatal ') + d.type + '/' + d.details + extra);
  });

  video.addEventListener('stalled', function () { line('WARN', 'element stalled'); });
  video.addEventListener('waiting', function () { line('WARN', 'element waiting'); });
  video.addEventListener('ended', function () { line('ERROR', 'element ended'); });
  video.addEventListener('error', function () {
    line('ERROR', 'element error ' + (video.error && video.error.code) + ' ' + (video.error && video.error.message));
  });

  hls.loadSource(src);
  hls.attachMedia(video);

  setInterval(function () {
    var b = video.buffered;
    var end = b.length ? b.end(b.length - 1) : 0;
    var loaded = 0;
    for (var i = 0; i < rows.length; i++) if (rows[i].indexOf('loaded') !== -1) loaded++;
    stateEl.textContent = 't=' + video.currentTime.toFixed(1) + 's ahead=' + (end - video.currentTime).toFixed(2) +
      's readyState=' + video.readyState + ' paused=' + video.paused + ' net=' + video.networkState + ' frags=' + loaded;
  }, 1000);
})();
</script>
</body>
</html>
